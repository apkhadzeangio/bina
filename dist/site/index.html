<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ბინის დიზაინერი</title>
<meta name="description" content="ბინის ზუსტი გეგმა, მასალები საქართველოს ბაზრიდან და ხარჯთაღრიცხვა.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500;600;700&display=swap">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}/* Layout: a drafting table — the plan sheet fills the screen, a spec-sheet inspector sits on its right,
   the three real steps of the job run along the top. Numbers are set in a mono face like dimension text. */
:root {
  --bg: #e9ece8;
  --panel: #fbfbf9;
  --panel-2: #f2f4f1;
  --ink: #1b2125;
  --muted: #5f686d;
  --line: #d3d8d2;
  --accent: #2b4ec4;
  --accent-ink: #ffffff;
  --accent-soft: rgba(43, 78, 196, 0.12);
  --warn: #b0561c;
  --warn-soft: rgba(176, 86, 28, 0.1);
  --ok: #2b7653;
  --plan-bg: #f8f9f6;
  --grid: #e8eae5;
  --grid-major: #d4d8d0;
  --wall: #262c30;
  --furn: #fdfdfb;
  --furn-ink: #3a4246;
  --p-dry: #ead8b8;
  --p-kitchen: #d1e1c1;
  --p-wet: #c1d8e8;
  --p-hall: #dedad0;
  --p-utility: #d9d1e4;
  --p-outdoor: #cde4d3;
  --view-bg: #e3e6e1;
  --slab: #57554f;
  --wall-cap: #2e2d2b;
  --shadow: 0 1px 2px rgba(20, 30, 35, 0.06), 0 8px 24px rgba(20, 30, 35, 0.08);
  --font-body: "Noto Sans Georgian", "BPG Arial", "Sylfaen", system-ui, sans-serif;
  --font-display: "Noto Serif Georgian", "Noto Sans Georgian", "Sylfaen", Georgia, serif;
  --font-mono: "IBM Plex Mono", "Noto Sans Georgian", ui-monospace, "SFMono-Regular", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101315;
    --panel: #181c1f;
    --panel-2: #1e2326;
    --ink: #e4e8e6;
    --muted: #98a2a6;
    --line: #2c3337;
    --accent: #8aa5ff;
    --accent-ink: #0b1430;
    --accent-soft: rgba(138, 165, 255, 0.16);
    --warn: #f0a36b;
    --warn-soft: rgba(240, 163, 107, 0.12);
    --ok: #6fcf9f;
    --plan-bg: #15191b;
    --grid: #1d2225;
    --grid-major: #283034;
    --wall: #d8dedb;
    --furn: #20262a;
    --furn-ink: #b9c2c6;
    --p-dry: #4b4231;
    --p-kitchen: #36462f;
    --p-wet: #2b4253;
    --p-hall: #3a3a35;
    --p-utility: #3d3749;
    --p-outdoor: #2e4535;
    --view-bg: #1a1e20;
    --slab: #2b2a28;
    --wall-cap: #0e0e0d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101315;
  --panel: #181c1f;
  --panel-2: #1e2326;
  --ink: #e4e8e6;
  --muted: #98a2a6;
  --line: #2c3337;
  --accent: #8aa5ff;
  --accent-ink: #0b1430;
  --accent-soft: rgba(138, 165, 255, 0.16);
  --warn: #f0a36b;
  --warn-soft: rgba(240, 163, 107, 0.12);
  --ok: #6fcf9f;
  --plan-bg: #15191b;
  --grid: #1d2225;
  --grid-major: #283034;
  --wall: #d8dedb;
  --furn: #20262a;
  --furn-ink: #b9c2c6;
  --p-dry: #4b4231;
  --p-kitchen: #36462f;
  --p-wet: #2b4253;
  --p-hall: #3a3a35;
  --p-utility: #3d3749;
  --p-outdoor: #2e4535;
  --view-bg: #1a1e20;
  --slab: #2b2a28;
  --wall-cap: #0e0e0d;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 16px;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { display: inline-grid; place-items: center; flex: none; }

/* ------------------------------------------------------------------ header */
.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding-block: 12px;
  position: relative;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.brand-mark { color: var(--accent); display: grid; }
.brand-name { font: 600 17px/1 var(--font-display); letter-spacing: 0.01em; white-space: nowrap; }
.steps { display: flex; gap: 2px; margin-inline: auto; background: var(--panel-2); padding: 3px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); }
.step-link {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px 5px 5px;
  border-radius: 999px;
  color: var(--muted);
  text-decoration: none;
  font-weight: 500;
  white-space: nowrap;
}
.step-link .n {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font: 500 12px/1 var(--font-mono);
  box-shadow: inset 0 0 0 1.2px currentColor;
}
.step-link:hover { color: var(--ink); }
.step-link[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, 0.05); }
.step-link[aria-current="page"] .n { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.top-actions { position: relative; display: flex; gap: 8px; }
.menu-pop {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  width: min(300px, calc(100vw - 32px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 6px;
  display: flex;
  flex-direction: column;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 9px 10px;
  border: 0;
  background: none;
  border-radius: 6px;
  cursor: pointer;
}
.menu-item:hover { background: var(--panel-2); }
.menu-item.danger { color: var(--warn); }
.menu-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.menu-note { font-size: 12px; color: var(--muted); padding: 6px 10px 4px; }
.menu-note.warn { color: var(--warn); }
.copy-fallback { width: 100%; min-height: 90px; margin-top: 6px; font: 12px var(--font-mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }

/* ------------------------------------------------------------------ buttons and fields */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 500;
  font-size: 13.5px;
  line-height: 1.2;
  padding: 8px 13px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.btn:hover { border-color: color-mix(in srgb, var(--ink) 28%, var(--line)); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-accent:hover { border-color: var(--accent); filter: brightness(1.06); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--panel-2); border-color: transparent; }
.btn-sm { padding: 6px 10px; font-size: 12.5px; }
.btn-block { width: 100%; padding: 11px 14px; }
.btn.danger { color: var(--warn); }
.btn.danger.armed { background: var(--warn-soft); }
.icon-btn { padding: 6px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.link { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 3px; cursor: pointer; text-align: left; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .field > span:first-child { font-size: 12.5px; color: var(--muted); }
.field-in { display: inline-flex; align-items: center; gap: 6px; }
.field-hint { font-size: 12px; color: var(--muted); }
.unit { font-size: 12.5px; color: var(--muted); }
.text-in, .num-in, .unit-sel {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 6px;
  padding: 7px 9px;
  min-width: 0;
}
.text-in { width: 100%; }
.num-in { width: 88px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.num-in:disabled { opacity: 0.45; }
.text-in:focus, .num-in:focus, .unit-sel:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
input[type="range"] { accent-color: var(--accent); width: 100%; }

.seg { display: flex; gap: 2px; padding: 3px; background: var(--panel-2); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
.seg-btn {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--muted);
  font-weight: 500;
  font-size: 13px;
}
.seg-btn.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, 0.06); }
.seg-lg .seg-btn { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; text-align: left; align-items: flex-start; }
.seg-lg .seg-btn b { font-weight: 600; color: var(--ink); }
.seg-lg .seg-btn span { font-size: 12px; color: var(--muted); font-weight: 400; }
.seg-lg .seg-btn.on b { color: var(--accent); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  border: 1px solid var(--line);
  background: transparent;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
}
.tab.on { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.chip-soft { background: var(--accent-soft); color: var(--accent); }
.dot { width: 11px; height: 11px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); }

/* ------------------------------------------------------------------ main */
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.step { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

.sample-banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  padding: 10px 14px;
  border-radius: var(--r);
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
}
.banner-txt { font-size: 13.5px; }

/* ------------------------------------------------------------------ plan step */
.plan-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; }
.plan-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.toolbar {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 7px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: thin;
}
.tool-group { display: flex; gap: 3px; }
.tool { padding: 7px 10px; border-color: transparent; background: transparent; gap: 7px; }
.tool:hover { background: var(--panel-2); border-color: transparent; }
.tool.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.tool.icon-only { padding: 7px; }
.hintbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  padding: 8px 12px;
  min-height: 46px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.hint-text { color: var(--ink); max-width: 72ch; }
.hint-x, .hint-unit { color: var(--muted); font-size: 12.5px; }
.hintbar .num-in { width: 84px; padding: 5px 8px; }
.hintbar .unit-sel { padding: 5px 6px; }
.canvas-wrap { position: relative; flex: 1; min-height: 0; background: var(--plan-bg); }
canvas.plan { position: absolute; inset: 0; display: block; touch-action: none; outline: none; }
canvas.plan:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }

.purpose-pop {
  position: absolute;
  z-index: 5;
  width: min(320px, calc(100% - 16px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.purpose-pop:focus { outline: none; }
.pop-head { display: flex; justify-content: space-between; align-items: center; }
.purpose-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.purpose-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  text-align: left;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  cursor: pointer;
  font-size: 12.5px;
  line-height: 1.25;
}
.purpose-chip:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.purpose-chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }

.sheet { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.sheet-handle { display: none; }
.inspector {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
}
.insp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.insp-head h2, .room-title { font: 600 21px/1.25 var(--font-display); }
.back { padding-left: 4px; }
.card-sec { display: flex; flex-direction: column; gap: 9px; padding-top: 13px; border-top: 1px solid var(--line); }
.sec-title { font-size: 11.5px; font-weight: 600; letter-spacing: 0.05em; color: var(--muted); }
.status { font-size: 12.5px; padding: 7px 9px; border-radius: 6px; }
.status.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.upload-sec .btn { align-self: flex-start; }
.room-list { display: flex; flex-direction: column; }
.room-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 9px;
  padding: 7px 6px;
  border: 0;
  border-bottom: 1px dashed var(--line);
  background: none;
  text-align: left;
  cursor: pointer;
  border-radius: 4px;
}
.room-row:hover { background: var(--panel-2); }
.room-row .num { font-size: 12.5px; }
.room-name { min-width: 0; overflow-wrap: anywhere; }
.totals { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.totals > div, .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.totals b, .kv b { font-weight: 500; }
.warn-sec .sec-title { color: var(--warn); }
.warn-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--warn); }
.big-stat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.big-stat > div { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; background: var(--panel-2); border-radius: 7px; }
.big-stat .lbl { font-size: 11.5px; color: var(--muted); line-height: 1.25; }
.big-stat b { font-size: 15px; font-weight: 500; }
.wall-list, .run-list { display: flex; flex-direction: column; gap: 4px; }
.wall-row, .run-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 9px;
  padding: 3px 4px;
  border-radius: 6px;
}
.run-row { grid-template-columns: 1fr auto; }
.wall-row:hover, .run-row:hover { background: var(--accent-soft); }
.wall-n { width: 22px; height: 22px; display: grid; place-items: center; font: 500 11.5px var(--font-mono); border-radius: 5px; background: var(--panel-2); color: var(--muted); }
.wall-desc { font-size: 12.5px; color: var(--muted); min-width: 0; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sub { display: flex; flex-direction: column; gap: 9px; }

/* ------------------------------------------------------------------ materials step */
.mat-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(340px, 1fr); gap: 12px; }
.view-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
.view-wrap { position: relative; flex: 1; min-height: 320px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--view-bg); }
.view-box { position: absolute; inset: 0; }
.view-box canvas { display: block; cursor: grab; }
.view-box canvas:active { cursor: grabbing; }
.view-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
.view-tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
.btn-float { background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(6px); }
.seg-float { background: color-mix(in srgb, var(--panel-2) 92%, transparent); backdrop-filter: blur(6px); }
.seg-float .seg-btn { flex: none; padding: 6px 10px; font-size: 12.5px; white-space: nowrap; }
.view-tools { flex-wrap: wrap; justify-content: flex-end; left: 10px; pointer-events: none; }
.view-tools > * { pointer-events: auto; }
.btn-float.on { color: var(--accent); border-color: var(--accent); }
.view-caption { font-size: 13px; min-height: 20px; }
.mat-col { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mat-panel { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.mat-sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { font: 600 19px/1.2 var(--font-display); }
.style-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.style-card {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 7px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--panel);
  cursor: pointer;
}
.style-card:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.style-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.style-sw { display: grid; grid-template-columns: 1fr 1fr; border-radius: 5px; overflow: hidden; width: 52px; height: 52px; }
.style-sw .sw { width: 100%; height: 100%; display: block; }
.style-name { font-weight: 600; font-size: 12.5px; line-height: 1.3; }
.style-desc { font-size: 13px; color: var(--muted); }
.style-desc b { color: var(--ink); font-weight: 600; }
.reset-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.room-sec { padding-top: 14px; border-top: 1px solid var(--line); scroll-margin-top: 8px; }
.room-sec.focus .room-h { color: var(--accent); }
.room-h { display: flex; align-items: center; gap: 9px; font: 600 15.5px/1.3 var(--font-body); }
.room-h.as-btn { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
.room-h .muted { font-size: 12.5px; font-weight: 400; }
.room-h .ic { margin-left: auto; color: var(--muted); }
.rows { display: flex; flex-direction: column; gap: 4px; }
.mat-row {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;
  padding: 6px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: none;
  text-align: left;
  cursor: pointer;
}
.mat-row:hover { background: var(--panel-2); border-color: var(--line); }
.mat-row .sw { width: 44px; height: 44px; border-radius: 6px; display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1); }
.mat-txt { display: flex; flex-direction: column; min-width: 0; }
.mat-surface { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mat-name { font-weight: 500; }
.mat-spec { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.mat-change { font-size: 12.5px; color: var(--accent); font-weight: 500; }
.total-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  background: var(--panel-2);
}
.total-bar > div { display: flex; flex-direction: column; }
.total-sum { font-size: 20px; font-weight: 500; }
.note { padding-bottom: 8px; }

.picker {
  width: min(760px, calc(100vw - 32px));
  max-height: min(86vh, 860px);
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.picker[open] { display: flex; flex-direction: column; }
.picker::backdrop { background: rgba(12, 16, 18, 0.45); }
.picker > * { margin-inline: 18px; }
.picker-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-top: 16px; }
.picker-head h2 { font: 600 22px/1.2 var(--font-display); }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: 0.03em; }
.picker .seg, .picker .tabs { margin-top: 12px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding-block: 14px 18px; overflow-y: auto; }
.pick-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  padding: 7px 7px 9px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  cursor: pointer;
}
.pick-card:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.pick-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pick-card .sw { width: 100%; aspect-ratio: 1; height: auto; max-width: 100%; border-radius: 6px; display: block; margin-bottom: 4px; }
.pick-on { position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.pick-name { font-weight: 500; font-size: 13px; line-height: 1.3; }
.pick-spec { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.pick-shop { font-size: 11.5px; color: var(--ink); line-height: 1.3; }
.pick-note { color: var(--muted); }
.pick-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: auto; padding-top: 4px; font-size: 12px; }
.tier { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tier-prem { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); color: var(--accent); }
.picker-foot { padding-bottom: 16px; }

/* ------------------------------------------------------------------ furniture library */
.lib .lib-room { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 10px; font-size: 13px; }
.lib .lib-room label { color: var(--muted); }
.lib-body { overflow-y: auto; padding-block: 6px 18px; display: flex; flex-direction: column; gap: 14px; margin-inline: 0 !important; padding-inline: 18px; }
.lib-sec h3 { font: 600 14px/1.3 var(--font-display); margin: 6px 0 8px; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.lib-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 6px 9px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  cursor: pointer;
  text-align: center;
}
.lib-card:hover, .lib-card:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); outline: none; }
.lib-thumb { display: grid; place-items: center; width: 100%; padding: 4px 0; border-radius: 6px; background: var(--plan-bg); }
.lib-name { font-weight: 500; font-size: 12.5px; line-height: 1.3; }
.lib-size { font-size: 11px; color: var(--muted); }

/* furniture in the inspector */
.f-dot { width: 11px; height: 11px; border-radius: 3px; flex: none; border: 1.5px solid var(--muted); background: var(--furn); }
.f-dot.warn, .f-dot.error { border-color: var(--warn); background: var(--warn-soft); }
.field-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field-grid-3 .num-in { width: 100%; min-width: 0; }
.field-grid-3 .field-in { display: flex; }
.snap-row { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.warn-list li.warn { color: var(--warn); }
.warn-list li.error { color: var(--warn); font-weight: 600; }
.card-sec .seg { flex-wrap: wrap; }
.card-sec .seg-btn { font-family: var(--font-mono); font-size: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------------ provenance, samples, board */
.prov { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.badge { display: inline-flex; align-items: center; font-size: 11px; line-height: 1.35; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); white-space: nowrap; }
.badge.v-verified { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok) 9%, var(--panel)); }
.badge.v-listed { color: var(--ink); }
.badge.v-indicative, .badge.v-estimate { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.badge.v-preference, .badge.k-preference { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); border-style: dashed; }
.badge.k-product-image { color: var(--ok); }
.mat-txt .prov { margin-top: 3px; }
.sample { position: relative; display: block; line-height: 0; }
.sample .sw { display: block; }
.sample-cap { position: absolute; left: 4px; bottom: 4px; font-size: 10px; line-height: 1.3; padding: 1px 5px; border-radius: 4px; background: rgba(20, 24, 26, 0.62); color: #fff; letter-spacing: 0.01em; }
.room-head { display: flex; align-items: center; gap: 8px; }
.room-head .room-h { flex: 1; min-width: 0; }
.refs-sec { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); }
.refs-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.filters { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.flabel { font-size: 12px; color: var(--muted); min-width: 64px; }
.fchip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink); }
.fchip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.fcount { margin-left: auto; }
.pick-card { padding: 0; overflow: hidden; }
.pick-main { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; padding: 7px 7px 6px; border: 0; background: none; cursor: pointer; color: inherit; position: relative; flex: 1; }
.pick-card .sample .sw { width: 100%; aspect-ratio: 1; height: auto; border-radius: 6px; margin-bottom: 4px; }
.pick-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 0 7px 8px; }
.pick-link { font-size: 12px; color: var(--accent); white-space: nowrap; }
.pick-empty { padding: 28px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }

.modal.board { width: min(980px, calc(100vw - 24px)); }
.board-strip { display: flex; gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.board-strip .sw { flex: 1; min-width: 0; height: 56px; width: auto; display: block; }
.board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.board-card { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.board-card.must { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: inset 3px 0 0 var(--accent); }
.board-card .sample .sw { width: 168px; height: 168px; border-radius: 8px; }
.board-txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.modal .board-txt h3 { font: 600 15.5px/1.3 var(--font-body); margin: 0; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; margin: 2px 0 0; font-size: 12.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts a { color: var(--accent); }
.board-ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 4px; }
.board-ctrl .field-in { flex-wrap: wrap; max-width: 100%; }
.board-ctrl .unit-sel { max-width: 100%; min-width: 0; }
@media (max-width: 560px) {
  .board-card { grid-template-columns: 1fr; }
  .board-card .sample .sw { width: 100%; height: 120px; }
  .refs-sec { flex-direction: column; align-items: flex-start; }
}

/* ------------------------------------------------------------------ estimate step */
.step-estimate { overflow-y: auto; }
.step-estimate > * { width: 100%; max-width: 1180px; margin-inline: auto; }
.est-head {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr);
  gap: 16px 28px;
  padding: 20px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.est-total { display: flex; flex-direction: column; gap: 6px; }
.est-total .total { font: 500 clamp(34px, 5vw, 50px)/1.05 var(--font-mono); letter-spacing: -0.02em; }
.metrics { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: start; }
.metric { flex: 1 1 140px; display: flex; flex-direction: column; gap: 2px; padding: 9px 11px; background: var(--panel); }
.metric span { font-size: 11.5px; color: var(--muted); }
.metric b { font-weight: 500; font-size: 14.5px; }
.est-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.tabs-lg { padding-top: 4px; }
.tabs-lg .tab { padding: 8px 14px; font-size: 13.5px; }
.table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.est-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 880px; }
.est-table th, .est-table td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.est-table thead th { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.03em; background: var(--panel-2); position: sticky; top: 0; }
.est-table td.num { white-space: nowrap; }
.est-table .r { text-align: right; }
.est-table tr.grp th { font: 600 14px var(--font-display); padding-top: 16px; background: transparent; border-bottom-color: var(--ink); }
.est-table tr.grp td { padding-top: 16px; border-bottom-color: var(--ink); font-weight: 600; }
.est-table tr.sum th, .est-table tr.sum td { font-weight: 600; background: var(--panel-2); border-bottom: 0; font-size: 14px; }
.cell-name { font-weight: 500; }
.cell-spec { font-size: 12px; color: var(--muted); }
.cell-where { font-size: 12.5px; color: var(--muted); max-width: 220px; }
.cell-note { font-size: 11.5px; color: var(--warn); }
.est-table a.shop { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); white-space: nowrap; }
.shops { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; }
.shops a { color: var(--accent); }
.rooms-table { min-width: 820px; }
.rooms-table td.num { text-align: right; }
.rooms-table th:not(:first-child) { text-align: right; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.rules section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.rules h3 { font: 600 16px var(--font-display); margin-bottom: 8px; }
.rules ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.rules > p { grid-column: 1 / -1; }
.step-estimate .muted.small { max-width: 80ch; }
.empty { margin: 40px auto; max-width: 420px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 24px; }
.empty h2 { font: 600 22px var(--font-display); }

/* ------------------------------------------------------------------ empty, loading and dialogs */
.canvas-empty {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
  width: min(440px, calc(100% - 32px));
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 20px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.canvas-empty b { font: 600 18px/1.3 var(--font-display); }
.boot { margin: 18vh auto 0; max-width: 440px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: var(--muted); }
.boot-error b { color: var(--ink); font: 600 20px var(--font-display); }
.btn-lg { padding: 12px 16px; font-size: 15px; border-radius: 9px; }

.modal {
  width: min(580px, calc(100vw - 24px));
  max-height: min(90dvh, 860px);
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  color: var(--ink);
  box-shadow: var(--shadow);
  overflow: auto;
  overscroll-behavior: contain;
}
.modal::backdrop { background: rgba(12, 16, 18, 0.5); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 22px 0; }
.modal-body { display: flex; flex-direction: column; gap: 18px; padding: 22px; }
.modal-head + .modal-body { padding-top: 12px; }
.modal h2 { font: 600 24px/1.25 var(--font-display); }
.modal h3 { font: 600 15px/1.3 var(--font-display); margin-bottom: 8px; }
.journey { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.journey li { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
.journey-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 600 13px/1 var(--font-mono); }
.journey-ic { color: var(--accent); }
.journey-txt { display: flex; flex-direction: column; gap: 2px; }
.journey-txt b { font-weight: 600; }
.journey-txt span { font-size: 13px; color: var(--muted); }
.journey-compact li { padding: 8px 10px; }
.welcome-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.welcome-sample { align-self: center; color: var(--accent); font-weight: 500; padding: 6px; }
.kv-list { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 7px 16px; margin: 0; font-size: 13.5px; }
.kv-list dt { color: var(--muted); }
.kv-list dd { margin: 0; }
.kv-list.keys { grid-template-columns: auto minmax(0, 1fr); }
kbd { font: 500 12px/1.4 var(--font-mono); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--panel-2); white-space: nowrap; }
@media (hover: none) { .help-keys { display: none; } }

/* ------------------------------------------------------------------ toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  max-width: min(520px, calc(100vw - 32px));
  background: var(--ink);
  color: var(--panel);
  padding: 10px 14px;
  border-radius: 9px;
  font-size: 13.5px;
  box-shadow: var(--shadow);
  transition: opacity 0.18s, transform 0.18s;
  z-index: 100;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast[data-kind="warn"] { background: var(--warn); color: var(--panel); }
@media (prefers-reduced-motion: reduce) {
  #toast, .sheet { transition: none !important; }
}

/* ------------------------------------------------------------------ narrow screens */
.hint-extra { display: contents; }
/* the toolbar keeps one row: door, window, 3D and upload go icon-only first, then all tools */
@media (max-width: 1440px) {
  .tool[data-tool="door"] .tool-label, .tool[data-tool="window"] .tool-label, .tool-group:last-child .tool-label { display: none; }
}
@media (max-width: 1240px) {
  .tool-label { display: none; }
  .tool { padding: 8px; }
}
@media (max-width: 860px) {
  .hintbar .hint-extra { display: none; }
}
@media (hover: none) { .kbd-only { display: none; } }
@media (max-width: 1080px) {
  .tool-label { display: none; }
  .tool { padding: 8px; }
  .mat-layout { grid-template-columns: minmax(0, 1fr) minmax(320px, 0.9fr); }
}
@media (max-width: 860px) {
  #app { height: auto; min-height: 100%; }
  .main, .step { flex: none; }
  .topbar { flex-wrap: wrap; gap: 10px; }
  .steps { order: 3; width: 100%; margin: 0; }
  .step-link { flex: 1; justify-content: center; padding-right: 10px; }
  .top-actions { margin-left: auto; }
  .plan-layout { grid-template-columns: 1fr; }
  .canvas-wrap { flex: none; height: 64vh; min-height: 340px; }
  .inspector { overflow: visible; }
  .mat-layout { grid-template-columns: 1fr; }
  .view-wrap { flex: none; height: 52vh; min-height: 300px; }
  .mat-panel { overflow: visible; }
  .est-head { grid-template-columns: 1fr; }
  .step-estimate { overflow: visible; }
}
@media (max-width: 520px) {
  /* one header row: steps between help and menu; only the current step keeps its label */
  .brand { display: none; }
  .topbar { flex-wrap: nowrap; gap: 8px; }
  .steps { order: 0; flex: 1; width: auto; min-width: 0; }
  .step-link { flex: none; padding-right: 4px; }
  .step-link[aria-current="page"] { flex: 1; padding-right: 10px; }
  .step-link:not([aria-current="page"]) .step-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .top-actions { margin-left: 0; }
  .sample-banner { flex-wrap: nowrap; }
  .kv-list, .kv-list.keys { grid-template-columns: 1fr; gap: 2px; }
  .kv-list dd { margin-bottom: 8px; }
  .welcome-actions { grid-template-columns: 1fr; }
  .modal-body { padding: 18px; }
  .sample-banner .btn-row { flex-wrap: nowrap; }
  .style-grid { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 170px; overflow-x: auto; padding-bottom: 4px; }
  .brand-name, .hide-sm { display: none; }
  .step-label { font-size: 12.5px; }
  .step-link { gap: 5px; padding: 4px 8px 4px 4px; }
  .step-link .n { width: 21px; height: 21px; font-size: 11px; }
  .big-stat { grid-template-columns: 1fr 1fr; }
  .purpose-grid { grid-template-columns: 1fr 1fr; }
  .field-grid { grid-template-columns: 1fr 1fr; }
  .toolbar { justify-content: flex-start; }
  .lib-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .picker.lib { width: 100vw; max-width: 100vw; max-height: 92dvh; margin: auto 0 0; border-radius: 16px 16px 0 0; }
}

/* ------------------------------------------------------------------ phones and narrow tablets: plan fills the screen,
   the inspector is a bottom sheet with three heights (peek → half → full). */
@media (max-width: 860px) {
  body[data-step="plan"] #app { height: 100dvh; min-height: 0; padding-bottom: 0; }
  body[data-step="plan"] .main, body[data-step="plan"] .step-plan { flex: 1; min-height: 0; }
  .step-plan { gap: 8px; }
  .plan-layout { display: flex; flex-direction: column; }
  .plan-main { flex: 1; margin-bottom: calc(var(--peek) + 8px + env(safe-area-inset-bottom, 0px)); }
  body[data-step="plan"] .canvas-wrap { flex: 1; height: auto; min-height: 200px; }
  .sample-banner { padding: 8px 10px; gap: 8px; }
  .banner-txt { font-size: 12.5px; }
  .hintbar { min-height: 0; padding: 6px 10px; font-size: 12.5px; }
  .sheet {
    --sheet-h: calc(var(--peek) + env(safe-area-inset-bottom, 0px));
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    height: var(--sheet-h);
    max-height: 90dvh;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -6px 24px rgba(20, 30, 35, 0.14);
    transition: height 0.22s ease;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet[data-sheet="half"] { --sheet-h: 44dvh; }
  .sheet[data-sheet="full"] { --sheet-h: 88dvh; }
  .sheet-handle {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
    height: var(--peek);
    padding: 14px 16px 6px;
    position: relative;
    border: 0;
    background: none;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    touch-action: none;
  }
  .sheet-handle .grip { position: absolute; top: 7px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--line); }
  .sheet-title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-handle .ic { transform: rotate(-90deg); color: var(--muted); transition: transform 0.2s; }
  .sheet:not([data-sheet="peek"]) .sheet-handle .ic { transform: rotate(90deg); }
  .sheet .inspector { overflow-y: auto; overscroll-behavior: contain; border: 0; border-radius: 0; padding-top: 4px; }
  .sheet[data-sheet="peek"] .inspector { visibility: hidden; }
}
:root { --peek: 58px; }

/* ------------------------------------------------------------------ touch: targets of at least 44 px, 16 px inputs (no iOS zoom) */
@media (pointer: coarse) {
  .btn, .menu-item, .seg-btn, .purpose-chip, .room-row, .tab, .step-link, .mat-row, .style-card { min-height: 44px; }
  .btn, .tool, .icon-btn, .step-link { min-width: 44px; }
  .step-link { justify-content: center; }
  .text-in, .num-in, .unit-sel, .hintbar .num-in, textarea { font-size: 16px; }
  .num-in { width: 96px; }
  .check { min-height: 36px; }
  .check input { width: 22px; height: 22px; }
  .toolbar { scroll-snap-type: x proximity; }
  .tool-group > * { scroll-snap-align: start; }
}

/* Stage 05: room-first scene preparation. */
.step-scene { max-width: 1480px; margin: 0 auto; padding: 24px 24px 40px; }
.scene-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px; }
.scene-heading h1 { font-size:28px; margin:5px 0 10px; letter-spacing:-.5px; }
.scene-heading p { margin:4px 0; }
.scene-layout { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:22px; align-items:start; }
.scene-visuals, .scene-controls, .scene-review { min-width:0; }
.scene-image { overflow:hidden; }
.scene-image-head, .scene-image-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 18px; }
.scene-image-head .eyebrow { margin:0; }
.scene-viewport { position:relative; width:100%; background:var(--view-bg); min-height:200px; }
.scene-status { font-size:12px; line-height:1.6; margin:0; }
.scene-controls { padding:22px; }
.scene-field { display:flex; flex-direction:column; gap:8px; margin:12px 0 18px; font-size:12px; font-weight:500; }
.scene-field select, .scene-field input, .scene-field textarea { font:inherit; font-weight:400; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:11px 10px; min-width:0; width:100%; }
.scene-field textarea { resize:vertical; line-height:1.7; }
.scene-field-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.scene-field-row .scene-field { margin-top:0; }
.scene-options { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:15px 0; margin:16px 0 22px; }
.scene-options summary, .scene-data summary { cursor:pointer; font-size:13px; font-weight:600; min-height:32px; }
.scene-settings > .btn { width:100%; margin:5px 0; }
.scene-secondary { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:20px; }
.scene-plan-card, .scene-brief-card { padding:16px 18px; min-width:0; }
.scene-plan { display:block; width:100%; height:auto; }
.scene-brief { font-size:12px; line-height:1.95; }
.scene-brief p { margin:0 0 12px; }
.scene-revision { font-size:10px; color:var(--muted); overflow-wrap:anywhere; }
.scene-review-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin:28px 0 16px; }
.scene-review-head h2 { font-size:18px; margin:0; }
.scene-review-head > span { font-size:12px; }
.scene-material-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
.scene-material { padding:14px; display:flex; gap:13px; align-items:flex-start; min-width:0; border-top:3px solid var(--line); }
.scene-material.must { border-top-color:var(--accent); }
.scene-material > canvas { width:64px; height:64px; flex-shrink:0; border-radius:5px; }
.scene-material > div { min-width:0; }
.scene-material b { font-size:12px; overflow-wrap:anywhere; }
.scene-material p { margin:0 0 6px; }
.scene-material .check { font-size:11px; margin:8px 0; }
.scene-unresolved { min-width:64px; height:64px; background:var(--line); display:grid; place-content:center; font-size:25px; }
.scene-data { padding:18px; margin-top:18px; }
.scene-data pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:11px; line-height:1.7; max-height:400px; overflow:auto; }
.scene-table-wrap { overflow:auto; }
.scene-data table { width:100%; font-size:12px; border-collapse:collapse; margin-top:12px; }
.scene-data th, .scene-data td { text-align:left; border-bottom:1px solid var(--line); padding:10px; white-space:nowrap; }
.scene-warnings { padding:18px; margin:18px 0; border-left:3px solid #b28a55; overflow-wrap:anywhere; }
.scene-export-bar { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-top:24px; padding:22px; }
.scene-export-bar p { margin:6px 0 0; }
.scene-export-bar b { font-size:14px; }
.scene-export-bar .btn { flex-shrink:0; }
@media (max-width:1100px) {
  .scene-layout { grid-template-columns:minmax(0,1fr) 290px; gap:16px; }
  .scene-secondary { grid-template-columns:1fr; }
  .scene-material-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:860px) {
  .step-scene { padding:18px 14px 28px; }
  .scene-heading { gap:10px; align-items:flex-start; margin-bottom:18px; }
  .scene-heading h1 { font-size:23px; }
  .scene-heading > div > p.muted { font-size:11px; line-height:1.9; }
  .scene-heading > .btn { max-width:96px; white-space:normal; font-size:10px; }
  .scene-layout { display:flex; flex-direction:column; gap:16px; }
  .scene-visuals { display:contents; }
  .scene-image { order:0; width:100%; }
  .scene-controls { order:1; width:100%; padding:18px; }
  .scene-secondary { order:2; width:100%; margin:0; grid-template-columns:1fr; }
  .scene-viewport { min-height:0; }
  .scene-image-head { padding:12px; flex-wrap:wrap; }
  .scene-image-foot { padding:12px; }
  .scene-material-grid { grid-template-columns:1fr; }
  .scene-review-head { flex-direction:column; gap:8px; }
  .scene-export-bar { position:sticky; bottom:8px; z-index:5; padding:12px; box-shadow:0 3px 20px #0002; }
  .scene-export-bar > div { display:none; }
  .scene-export-bar > .btn { width:100%; }
}
